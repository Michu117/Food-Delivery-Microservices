# Construye las imágenes de los microservicios y del gateway y las publica en
# GitHub Container Registry (ghcr.io), gratis, en lugar de Azure Container Registry.
name: Imágenes de contenedores (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main, azure-deploy]
    paths:
      - "backend/**"
      - "delivery-service/backend/**"
      - "gateway/**"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            context: backend/auth-service
          - name: restaurant
            context: backend/restaurant-service
          - name: order
            context: backend/order-service
          - name: payment
            context: backend/payment-service
          - name: delivery
            context: delivery-service/backend
          - name: gateway
            context: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Dueño del repositorio en minúsculas (requisito de ghcr.io)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/skydish-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/skydish-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
