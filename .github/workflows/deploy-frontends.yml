# Compila los dos frontends (clientes/restaurantes y repartidores) apuntando al
# API Gateway y los publica como sitios web estáticos de Azure Storage.
# (Static Web Apps no está disponible en las regiones permitidas por Azure for Students.)
#
# Configuración previa en GitHub (Settings > Secrets and variables > Actions),
# con los valores que imprime infra/04-aplicaciones.sh:
#   Variables: GATEWAY_URL, STORAGE_ACCOUNT_WEB, STORAGE_ACCOUNT_DRIVER,
#              STRIPE_PUBLISHABLE_KEY (opcional, pk_test_...)
#   Secretos:  AZURE_STORAGE_SAS_WEB, AZURE_STORAGE_SAS_DRIVER
name: Frontends (Azure Storage)

on:
  workflow_dispatch:
  push:
    branches: [main, azure-deploy]
    paths:
      - "frontend/**"
      - "delivery-service/frontend/**"
      - ".github/workflows/deploy-frontends.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dir: frontend
            account: STORAGE_ACCOUNT_WEB
            sas: AZURE_STORAGE_SAS_WEB
          - name: driver
            dir: delivery-service/frontend
            account: STORAGE_ACCOUNT_DRIVER
            sas: AZURE_STORAGE_SAS_DRIVER
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuración
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: |
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error::Falta la variable GATEWAY_URL (URL pública del gateway)."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reemplazar URLs de localhost por el API Gateway
        env:
          GW: ${{ vars.GATEWAY_URL }}
        run: |
          GW="${GW%/}"
          find src -type f \( -name '*.js' -o -name '*.jsx' \) -exec sed -i \
            -e "s#http://localhost:5001#${GW}/auth#g" \
            -e "s#http://localhost:5002#${GW}/restaurant#g" \
            -e "s#http://localhost:5003#${GW}/delivery#g" \
            -e "s#http://localhost:5004#${GW}/payment#g" \
            -e "s#http://localhost:5005#${GW}/order#g" {} +
          echo "URLs restantes con localhost:"; grep -rn "localhost:50" src || echo "ninguna"

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compilar
        env:
          CI: "false"
          REACT_APP_SOCKET_ORIGIN: ${{ vars.GATEWAY_URL }}
          REACT_APP_SOCKET_PATH: /delivery/socket.io
          STRIPE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        run: |
          # Solo se sobrescribe la clave de Stripe si la variable está definida
          if [ -n "$STRIPE_KEY" ]; then export REACT_APP_STRIPE_PUBLISHABLE_KEY="$STRIPE_KEY"; fi
          npm run build

      - name: Publicar en Azure Storage (contenedor $web)
        env:
          ACCOUNT: ${{ vars[matrix.account] }}
          SAS: ${{ secrets[matrix.sas] }}
        run: |
          if [ -z "$ACCOUNT" ] || [ -z "$SAS" ]; then
            echo "::error::Faltan la variable ${{ matrix.account }} o el secreto ${{ matrix.sas }}."; exit 1
          fi
          # index.html sin caché para que los cambios se vean de inmediato
          az storage blob upload-batch --account-name "$ACCOUNT" --sas-token "$SAS" \
            -d '$web' -s build --overwrite --only-show-errors \
            --pattern '*' --content-cache-control "public, max-age=3600"
          az storage blob upload --account-name "$ACCOUNT" --sas-token "$SAS" \
            -c '$web' -n index.html -f build/index.html --overwrite --only-show-errors \
            --content-type "text/html" --content-cache-control "no-cache"
          echo "Publicado en https://$ACCOUNT.z9.web.core.windows.net (la URL exacta la muestra el script 04)"
